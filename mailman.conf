server {
    listen 80;
    server_name list.domain.com;

    # Certbot webroot dogrulama
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Diger tum istekleri HTTPS'e yonlendir
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name list.domain.com;

    client_max_body_size 25M;

# SSL sertifika
    ssl_certificate     /etc/letsencrypt/live/list.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/list.domain.com/privkey.pem;

# SSL guvenlik ayarlari
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location /static {
        alias /opt/mailman/web/static;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://mailman-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}
